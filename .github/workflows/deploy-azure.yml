name: Deploy ChomblyWebsite to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.x"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build standalone
        run: npm run build:azure
        env:
          NEXT_PUBLIC_CHOMBLY_SITE_MODE: PRELAUNCH
          NEXT_PUBLIC_CHOMBLY_INDEXING_ENABLED: "false"
          NEXT_PUBLIC_CHOMBLY_BASE_URL: ${{ vars.NEXT_PUBLIC_CHOMBLY_BASE_URL || 'https://chomblywebsite.azurewebsites.net' }}

      - name: Package release
        run: |
          test -f dist/standalone/server.js
          rm -rf release && mkdir -p release/drizzle release/data
          cp -R dist/standalone/. release/
          cp drizzle/*.sql release/drizzle/
          cd release && zip -r ../release.zip .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: chomblywebsite
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: release.zip
